  {n:64,tag:"security",q:"What are customer-managed encryption keys (CMEK) in Cloud KMS, and when are they worth the overhead?",body:"<p>By default Google encrypts data with Google-managed keys. CMEK lets you control a Cloud KMS key used to encrypt supported services, giving you rotation control, the ability to disable or destroy the key to cut access, and separate duties. It adds operational responsibility.</p><div class=\"cmds\"><div class=\"cmd\">gcloud kms keyrings create prod --location=europe-west1</div><div class=\"cmd\">gcloud kms keys create bucket-key --keyring=prod --location=europe-west1 --purpose=encryption --rotation-period=90d --next-rotation-time=2026-12-01T00:00:00Z</div><div class=\"cmd\">gcloud storage buckets update gs://secure-bucket --default-encryption-key=projects/p/locations/europe-west1/keyRings/prod/cryptoKeys/bucket-key</div></div><div class=\"tip\"><b>Interview tip:</b> If the key is disabled or destroyed, the data becomes unreadable. Protect key admin access and enable key destruction scheduling delays.</div>"},
  {n:65,tag:"security",q:"Which Cloud Audit Logs types exist, and which must you enable explicitly?",body:"<p>Admin Activity logs are always on and free. System Event logs are always on. Data Access logs record reads and data writes but are off by default for most services (except BigQuery) and must be enabled. Policy Denied logs record security policy denials.</p><div class=\"cmds\"><div class=\"cmd\">gcloud projects get-iam-policy my-proj --format='yaml(auditConfigs)'</div><div class=\"cmd\">gcloud logging read 'logName:\"cloudaudit.googleapis.com%2Factivity\" AND protoPayload.methodName=\"SetIamPolicy\"' --limit 10</div><div class=\"cmd\">gcloud projects set-iam-policy my-proj policy-with-auditconfigs.yaml</div></div><div class=\"tip\"><b>Interview tip:</b> Data Access logs can be voluminous and costly, so enable them for sensitive services and exempt noisy service accounts.</div>"},
  {n:66,tag:"cicd",q:"What does Cloud Deploy add on top of Cloud Build for delivery to GKE and Cloud Run?",body:"<p>Cloud Build builds and tests artifacts. Cloud Deploy manages delivery pipelines across targets with promotion, approvals, canary and blue-green strategies through Skaffold, rollback, and a release audit trail.</p><div class=\"cmds\"><div class=\"cmd\">gcloud deploy apply --file=clouddeploy.yaml --region=europe-west1</div><div class=\"cmd\">gcloud deploy releases create rel-042 --delivery-pipeline=web --region=europe-west1 --images=web=europe-west1-docker.pkg.dev/proj/repo/web:42</div><div class=\"cmd\">gcloud deploy rollouts promote rel-042 --delivery-pipeline=web --region=europe-west1</div></div><div class=\"tip\"><b>Interview tip:</b> The key sentence: Build creates the artifact once, Deploy promotes the same artifact through environments.</div>"},
  {n:67,tag:"cicd",q:"How do Cloud Build private pools and triggers work, and why use them for builds that touch private resources?",body:"<p>Default workers run in a Google-managed network with no access to your VPC. Private pools run in a peered network, giving builds access to private registries, databases or GKE control planes, with custom machine sizes and VPC Service Controls support.</p><div class=\"cmds\"><div class=\"cmd\">gcloud builds worker-pools create private-pool --region=europe-west1 --peered-network=projects/host/global/networks/prod --worker-machine-type=e2-standard-4</div><div class=\"cmd\">gcloud builds triggers create github --name=main-build --repo-name=app --repo-owner=corp --branch-pattern='^main$' --build-config=cloudbuild.yaml --service-account=projects/p/serviceAccounts/builder@p.iam.gserviceaccount.com</div></div><div class=\"tip\"><b>Interview tip:</b> Use a dedicated user-specified service account per trigger instead of the legacy default Cloud Build account.</div>"},
  {n:68,tag:"cost",q:"How do committed use discounts work on GCP, and how do they differ from sustained use discounts?",body:"<p>Committed use discounts trade a one or three year commitment for a lower price, either resource-based (vCPU, memory) or spend-based (flexible). Sustained use discounts are automatic for some machine types and run-time, and are limited to older series. Combine with Spot for variable work.</p><div class=\"cmds\"><div class=\"cmd\">gcloud compute commitments create web-cud --region=europe-west1 --plan=12-month --resources=vcpu=64,memory=256GB</div><div class=\"cmd\">gcloud billing accounts list</div><div class=\"cmd\">bq query 'SELECT service.description, SUM(cost) FROM `billing.gcp_billing_export_v1_XXXX` GROUP BY 1 ORDER BY 2 DESC'</div></div><div class=\"tip\"><b>Interview tip:</b> Buy commitments for the steady baseline only, and review utilisation of the commitment monthly.</div>"},
  {n:69,tag:"cost",q:"How do you set up billing export to BigQuery and labels to attribute GCP costs to teams?",body:"<p>Enable standard and detailed usage cost export to a BigQuery dataset, standardise resource labels such as team and env enforced by policy, use folders and projects as the main boundary, and build dashboards with Looker Studio on the export data.</p><div class=\"cmds\"><div class=\"cmd\">bq query --use_legacy_sql=false 'SELECT labels.value AS team, SUM(cost) FROM `billing.gcp_billing_export_v1_X`, UNNEST(labels) AS labels WHERE labels.key=\"team\" GROUP BY 1'</div><div class=\"cmd\">gcloud billing budgets create --billing-account=ABC --display-name=team-a --budget-amount=5000USD --threshold-rule=percent=0.8</div></div><div class=\"tip\"><b>Interview tip:</b> Labels apply only from when they are set. They are not retroactive, so enforce them at resource creation.</div>"},
  {n:70,tag:"cost",q:"BigQuery on-demand versus capacity (slot) pricing: how do you choose and control query cost?",body:"<p>On-demand charges per TB scanned and shares a pool of slots. Capacity pricing buys dedicated slots with editions and autoscaling, giving predictable cost for heavy workloads. Control cost with partitioning, clustering, selecting only needed columns, and quotas.</p><div class=\"cmds\"><div class=\"cmd\">bq query --dry_run --use_legacy_sql=false 'SELECT * FROM `proj.ds.events` WHERE dt = \"2026-10-20\"'</div><div class=\"cmd\">bq query --maximum_bytes_billed=10000000000 --use_legacy_sql=false '...'</div><div class=\"cmd\">bq mk --reservation --location=EU --edition=ENTERPRISE --slot_capacity=100 prod-res</div></div><div class=\"tip\"><b>Interview tip:</b> Always partition large tables on a date column and require a partition filter to prevent accidental full scans.</div>"},
  {n:71,tag:"gke",q:"GKE pods are Pending with 'Insufficient' errors or IP allocation failures. How do you diagnose it?",body:"<p>Distinguish resource shortage from IP exhaustion. Check pod events, node allocatable versus requests, autoscaler status, and the pod secondary range utilisation. VPC-native clusters allocate a /24 slice of the pod range per node, which can run out.</p><div class=\"cmds\"><div class=\"cmd\">kubectl describe pod &lt;p&gt; | tail -15</div><div class=\"cmd\">kubectl get nodes -o custom-columns=NAME:.metadata.name,PODCIDR:.spec.podCIDR</div><div class=\"cmd\">gcloud container clusters describe prod --region europe-west1 --format='yaml(ipAllocationPolicy,defaultMaxPodsConstraint)'</div></div><div class=\"tip\"><b>Interview tip:</b> Lower max pods per node or add a discontiguous pod range to extend a cluster that ran out of pod IPs.</div>"},
  {n:72,tag:"gke",q:"A GKE Ingress or Gateway returns 502 errors and the backend shows as unhealthy. What do you check?",body:"<p>The Google load balancer health check must succeed against the pod. Check that firewall rules allow Google health check ranges, the readiness probe and health check path match, container-native NEGs are in use, and the app listens on the target port.</p><div class=\"cmds\"><div class=\"cmd\">kubectl describe ingress web</div><div class=\"cmd\">gcloud compute backend-services get-health k8s1-abc-web-80 --global</div><div class=\"cmd\">gcloud compute firewall-rules list --filter='sourceRanges:(130.211.0.0/22 35.191.0.0/16)'</div></div><div class=\"tip\"><b>Interview tip:</b> The load balancer health check is derived from the readiness probe by default, but only if the path and port are compatible.</div>"},
  {n:73,tag:"gke",q:"A GKE node auto-upgrade broke workloads. How do you reduce the blast radius next time?",body:"<p>Identify what changed: a Kubernetes version removing an API or changing behaviour, node image changes, or workloads that cannot tolerate disruption. Use release channels with soak, maintenance windows and exclusions, surge settings, PDBs, and test in staging.</p><div class=\"cmds\"><div class=\"cmd\">gcloud container operations list --filter='operationType:UPGRADE_NODES' --limit 5</div><div class=\"cmd\">kubectl get events -A --sort-by=.lastTimestamp | tail -30</div><div class=\"cmd\">gcloud container node-pools update pool1 --cluster prod --region europe-west1 --max-surge-upgrade 2 --max-unavailable-upgrade 0</div></div><div class=\"tip\"><b>Interview tip:</b> For a risky window, use a maintenance exclusion, and for a rollback create a new pool on the old version if the old minor is still supported.</div>"},
  {n:74,tag:"gke",q:"A pod using Workload Identity cannot access Google APIs and gets 403 or metadata server errors. How do you fix it?",body:"<p>Check that Workload Identity is enabled on the cluster and node pool, the Kubernetes service account is annotated with the Google service account, the IAM binding grants roles/iam.workloadIdentityUser to the right namespace and name, and the GSA has the needed permissions.</p><div class=\"cmds\"><div class=\"cmd\">kubectl get sa app -n prod -o yaml | grep iam.gke.io</div><div class=\"cmd\">gcloud iam service-accounts get-iam-policy app-gsa@proj.iam.gserviceaccount.com</div><div class=\"cmd\">kubectl exec &lt;p&gt; -- curl -s -H 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/email</div></div><div class=\"tip\"><b>Interview tip:</b> The member format is serviceAccount:PROJECT.svc.id.goog[NAMESPACE/KSA]. A typo there is the most common cause.</div>"},
  {n:75,tag:"gke",q:"The GKE cluster autoscaler is not adding nodes though pods are Pending. What are the usual causes on GCP?",body:"<p>Quota limits (CPUs, IPs, disks), max node count reached, no node pool that fits the pod's requests, selectors or zone constraints, a PVC bound to a zone with no capacity, or stockouts of a machine type in a zone.</p><div class=\"cmds\"><div class=\"cmd\">kubectl get events -A --field-selector reason=NotTriggerScaleUp</div><div class=\"cmd\">gcloud container clusters describe prod --region europe-west1 --format='yaml(autoscaling,nodePools[].autoscaling)'</div><div class=\"cmd\">gcloud compute regions describe europe-west1 --format='yaml(quotas)' | grep -B1 -A1 'CPUS\\|IN_USE_ADDRESSES'</div></div><div class=\"tip\"><b>Interview tip:</b> Use multiple zones and machine types, or node auto-provisioning, to reduce zonal stockout failures.</div>"},
  {n:76,tag:"gke",q:"Cloud Run cannot connect to Cloud SQL or a private service in your VPC. How do you set up connectivity?",body:"<p>Cloud Run is serverless and outside your VPC by default. Use the Cloud SQL connection (unix socket via the Auth proxy built-in) for Cloud SQL, and Direct VPC egress or a Serverless VPC Access connector for private IPs, with correct firewall rules and egress setting.</p><div class=\"cmds\"><div class=\"cmd\">gcloud run deploy api --image=... --add-cloudsql-instances=proj:europe-west1:db</div><div class=\"cmd\">gcloud run deploy api --image=... --network=prod --subnet=run-subnet --vpc-egress=private-ranges-only</div><div class=\"cmd\">gcloud run services describe api --region europe-west1 --format='yaml(spec.template.metadata.annotations)'</div></div><div class=\"tip\"><b>Interview tip:</b> The Cloud Run service account needs the Cloud SQL Client role, a frequent missing piece.</div>"},
  {n:77,tag:"observability",q:"A Pub/Sub subscription backlog keeps growing. How do you investigate and fix it?",body:"<p>Compare publish rate to ack rate, check oldest unacked message age, subscriber errors and ack deadline expirations, then scale subscribers, tune flow control, fix poison messages with dead-letter topics, and look at downstream dependencies.</p><div class=\"cmds\"><div class=\"cmd\">gcloud monitoring time-series list --filter='metric.type=\"pubsub.googleapis.com/subscription/num_undelivered_messages\"'</div><div class=\"cmd\">gcloud pubsub subscriptions describe orders-sub --format='yaml(ackDeadlineSeconds,deadLetterPolicy,retryPolicy)'</div><div class=\"cmd\">gcloud pubsub subscriptions update orders-sub --dead-letter-topic=orders-dlq --max-delivery-attempts=5</div></div><div class=\"tip\"><b>Interview tip:</b> Alert on oldest_unacked_message_age, not just message count, since age directly maps to user-visible delay.</div>"},
  {n:78,tag:"networking",q:"Cloud NAT drops connections with 'OUT_OF_RESOURCES' or allocation failures under load. What is the cause and fix?",body:"<p>Each NAT IP provides about 64,512 ports, divided among VMs. When a VM exhausts its allocated ports to the same destination, new connections fail. Raise minimum ports per VM, add NAT IPs, enable dynamic port allocation, and reuse connections.</p><div class=\"cmds\"><div class=\"cmd\">gcloud compute routers nats describe nat1 --router=rtr1 --region=europe-west1</div><div class=\"cmd\">gcloud compute routers nats update nat1 --router=rtr1 --region=europe-west1 --enable-dynamic-port-allocation --min-ports-per-vm=128 --max-ports-per-vm=4096</div><div class=\"cmd\">gcloud logging read 'resource.type=\"nat_gateway\" AND jsonPayload.allocation_status=\"DROPPED\"' --limit 10</div></div><div class=\"tip\"><b>Interview tip:</b> Connection pooling and keep-alive in the application is the cheapest fix, since it removes the need for so many ports.</div>"},
  {n:79,tag:"security",q:"A request is denied by VPC Service Controls and the team cannot reach a service from their CI system. How do you investigate and fix it safely?",body:"<p>Look up the violation in audit logs (Policy Denied) for the unique ID, which shows the source identity, network, service and which rule it breached. Fix with an ingress or egress rule scoped to the specific identity, project and method, or an access level, rather than loosening the perimeter.</p><div class=\"cmds\"><div class=\"cmd\">gcloud logging read 'protoPayload.metadata.violationReason=\"RESOURCES_NOT_IN_SAME_SERVICE_PERIMETER\"' --limit 5 --format=json</div><div class=\"cmd\">gcloud access-context-manager perimeters describe prod-perimeter --policy=POLICY_ID</div><div class=\"cmd\">gcloud access-context-manager perimeters dry-run update prod-perimeter --policy=POLICY_ID --add-ingress-policies=ingress.yaml</div></div><div class=\"tip\"><b>Interview tip:</b> Test changes in dry-run mode first, which logs would-be violations without enforcing.</div>"},
  {n:80,tag:"iam",q:"A deployment fails with 'Permission denied' even though the engineer has Owner. Which other layers could be blocking it?",body:"<p>Owner can still be blocked by organisation policies, IAM deny policies, VPC Service Controls, missing API enablement, billing issues, or quotas. Use Policy Troubleshooter and the error's details to find which layer denied the call.</p><div class=\"cmds\"><div class=\"cmd\">gcloud policy-troubleshoot iam //cloudresourcemanager.googleapis.com/projects/my-proj --principal-email=a@corp.com --permission=compute.instances.create</div><div class=\"cmd\">gcloud resource-manager org-policies list --project=my-proj</div><div class=\"cmd\">gcloud services list --enabled --project=my-proj | grep compute</div></div><div class=\"tip\"><b>Interview tip:</b> Read the full error. Organisation policy errors name the constraint, like constraints/compute.vmExternalIpAccess.</div>"},
  {n:81,tag:"cicd",q:"Terraform on GCP fails with 'API has not been used in project' or 'service account does not have permission'. How do you make it reliable?",body:"<p>Enable required APIs explicitly with google_project_service, wait for propagation using dependencies, grant the Terraform service account the needed roles, and check the right quota project and impersonation settings. Split bootstrap from application stacks.</p><div class=\"cmds\"><div class=\"cmd\">gcloud services enable compute.googleapis.com container.googleapis.com --project my-proj</div><div class=\"cmd\">terraform apply -var=impersonate_sa=tf-deployer@admin-proj.iam.gserviceaccount.com</div><div class=\"cmd\">gcloud auth application-default set-quota-project my-proj</div></div><div class=\"tip\"><b>Interview tip:</b> Use depends_on or the service resource output as a dependency so resources do not race the API enablement.</div>"},
  {n:82,tag:"cicd",q:"GKE cannot pull images from Artifact Registry and shows 403 or ImagePullBackOff. What do you check?",body:"<p>The node service account needs Artifact Registry Reader on the repository, the repository must be in a reachable location, private clusters need Private Google Access, and image paths must be exact. Check cross-project permissions and VPC Service Controls.</p><div class=\"cmds\"><div class=\"cmd\">kubectl describe pod &lt;p&gt; | grep -A5 Events</div><div class=\"cmd\">gcloud artifacts repositories get-iam-policy repo --location=europe-west1</div><div class=\"cmd\">gcloud artifacts docker images list europe-west1-docker.pkg.dev/proj/repo</div></div><div class=\"tip\"><b>Interview tip:</b> With custom node service accounts, remember to grant them the Reader role. Only the default account may have had it implicitly.</div>"},
  {n:83,tag:"cost",q:"A large GCP network egress charge appeared. How do you find the traffic and reduce it?",body:"<p>Use billing export by SKU to see whether it is internet egress, inter-region, inter-zone or CDN. Then VPC Flow Logs and Network Intelligence to find sources and destinations. Reduce with Cloud CDN, regional co-location, compression, caching, and private paths.</p><div class=\"cmds\"><div class=\"cmd\">bq query --use_legacy_sql=false 'SELECT sku.description, SUM(cost) c FROM `billing.gcp_billing_export_v1_X` WHERE service.description=\"Compute Engine\" AND sku.description LIKE \"%Egress%\" GROUP BY 1 ORDER BY c DESC'</div><div class=\"cmd\">gcloud compute networks subnets update app --region=europe-west1 --enable-flow-logs --logging-aggregation-interval=interval-5-min</div><div class=\"cmd\">gcloud compute backend-services update web --enable-cdn --global</div></div><div class=\"tip\"><b>Interview tip:</b> Cross-zone and cross-region traffic inside the same app is a quiet cost, so check topology before blaming the internet.</div>"},
  {n:84,tag:"cost",q:"Cloud Logging costs have exploded. How do you identify the source and reduce them without losing important logs?",body:"<p>Use Logs Explorer and the log volume metrics to see bytes ingested by resource and log name. Typical culprits are debug logging, load balancer or VPC flow logs, and chatty GKE containers. Add exclusion filters, sampling, routing to cheaper storage, and retention changes.</p><div class=\"cmds\"><div class=\"cmd\">gcloud logging metrics list</div><div class=\"cmd\">gcloud logging sinks update _Default --add-exclusion=name=drop-health,filter='httpRequest.requestUrl=~\"/healthz\"'</div><div class=\"cmd\">gcloud logging buckets update _Default --location=global --retention-days=14</div></div><div class=\"tip\"><b>Interview tip:</b> The logging/billing/bytes_ingested metric by resource_type quickly shows who generates the volume.</div>"},
  {n:85,tag:"observability",q:"A log sink to BigQuery is not receiving data. What do you check?",body:"<p>Verify the sink's filter matches entries, the sink's writer identity has BigQuery Data Editor on the dataset, the destination dataset exists in an allowed location, the sink is not disabled or excluded upstream, and check for sink errors in the logs.</p><div class=\"cmds\"><div class=\"cmd\">gcloud logging sinks describe audit-to-bq</div><div class=\"cmd\">bq show --format=prettyjson proj:audit | grep -i location</div><div class=\"cmd\">gcloud logging read 'logName:\"logging.googleapis.com%2Fsink_error\"' --limit 5</div></div><div class=\"tip\"><b>Interview tip:</b> The writer identity is created per sink. Copy it from the describe output and grant it on the destination, every time.</div>"},
  {n:86,tag:"compute",q:"A managed instance group keeps recreating instances in an autohealing loop. How do you stop it and find the cause?",body:"<p>Instances are failing the autohealing health check, often because the initial delay is too short, the check path or port is wrong, a firewall blocks health check ranges, or the app crashes under load. Disable autohealing temporarily, inspect an instance, then fix.</p><div class=\"cmds\"><div class=\"cmd\">gcloud compute instance-groups managed list-errors web-mig --region=europe-west1</div><div class=\"cmd\">gcloud compute instance-groups managed update web-mig --clear-autohealing --region=europe-west1</div><div class=\"cmd\">gcloud compute instances get-serial-port-output &lt;vm&gt; --zone=europe-west1-b | tail -50</div></div><div class=\"tip\"><b>Interview tip:</b> The serial port output shows startup script failures, which are a frequent root cause for new instances never becoming healthy.</div>"},
  {n:87,tag:"networking",q:"A Cloud VPN tunnel is established but BGP is down or routes are missing on-premises. How do you troubleshoot?",body:"<p>Check tunnel status and IKE logs, then BGP peer settings: ASNs, link-local IPs, MD5 if used, and Cloud Router advertised routes. Verify firewalls on both sides and that overlapping ranges are not present. Use route and learned-route views.</p><div class=\"cmds\"><div class=\"cmd\">gcloud compute vpn-tunnels describe tun1 --region=europe-west1 --format='yaml(status,detailedStatus)'</div><div class=\"cmd\">gcloud compute routers get-status rtr1 --region=europe-west1</div><div class=\"cmd\">gcloud compute routers update-bgp-peer rtr1 --peer-name=peer1 --region=europe-west1 --advertisement-mode=CUSTOM --set-advertisement-ranges=10.10.0.0/16</div></div><div class=\"tip\"><b>Interview tip:</b> Tunnel up and BGP down usually points to an ASN or link-local address mismatch, or a firewall dropping TCP 179.</div>"},
  {n:88,tag:"storage",q:"A Compute Engine persistent disk is almost full. How do you grow it online and avoid a repeat?",body:"<p>Resize the disk with gcloud, which works while attached, then grow the partition and filesystem in the guest. Take a snapshot first. Find the cause of growth and add monitoring with the Ops Agent for disk usage alerts.</p><div class=\"cmds\"><div class=\"cmd\">gcloud compute disks snapshot data1 --zone=europe-west1-b --snapshot-names=pre-resize</div><div class=\"cmd\">gcloud compute disks resize data1 --size=600GB --zone=europe-west1-b</div><div class=\"cmd\">sudo growpart /dev/sdb 1 &amp;&amp; sudo resize2fs /dev/sdb1</div></div><div class=\"tip\"><b>Interview tip:</b> Disks can only grow, never shrink, so go up in measured steps.</div>"},
  {n:89,tag:"security",q:"A Security Command Center finding reports a publicly accessible Cloud Storage bucket. How do you respond?",body:"<p>Confirm whether the exposure is intended, then remove public access, enable public access prevention and uniform bucket-level access, check access logs for what was read, and fix the pipeline or policy that allowed it. Use org policy to stop recurrence.</p><div class=\"cmds\"><div class=\"cmd\">gcloud storage buckets get-iam-policy gs://my-bucket --format=json | grep -E 'allUsers|allAuthenticatedUsers'</div><div class=\"cmd\">gcloud storage buckets update gs://my-bucket --public-access-prevention --uniform-bucket-level-access</div><div class=\"cmd\">gcloud resource-manager org-policies enable-enforce storage.publicAccessPrevention --organization=123</div></div><div class=\"tip\"><b>Interview tip:</b> Check Data Access audit logs, if enabled, to see whether anyone actually read objects while it was public.</div>"},
  {n:90,tag:"compute",q:"Spot VM or Spot GKE node preemptions are causing batch jobs to fail. How do you make them resilient?",body:"<p>Make work restartable: checkpoint progress, make tasks idempotent, use a queue so unfinished tasks return, handle the shutdown signal to save state, diversify zones and machine types, and keep a small on-demand pool to guarantee completion.</p><div class=\"cmds\"><div class=\"cmd\">gcloud compute instances describe worker1 --zone=europe-west1-b --format='value(scheduling.provisioningModel)'</div><div class=\"cmd\">kubectl get pods -o wide --field-selector status.phase=Failed</div><div class=\"cmd\">gcloud logging read 'protoPayload.methodName=\"compute.instances.preempted\"' --limit 10</div></div><div class=\"tip\"><b>Interview tip:</b> Measure preemption frequency. If a job is shorter than the typical time between preemptions, retries are cheap.</div>"}
];

let activeFilter = 'all';
let openCards = new Set();

function badge(tag) {
  const labels = {iam:'IAM & identity',gke:'GKE',networking:'Networking',storage:'Storage & data',compute:'Compute',observability:'Observability',security:'Security',cicd:'CI/CD & IaC',cost:'Cost'};
  return `<span class="badge ${tag}">${labels[tag] || tag}</span>`;
}

function render(qs) {
  document.getElementById('count-bar').textContent = `Showing ${qs.length} of 90 questions`;
  document.getElementById('q-list').innerHTML = qs.map(q => `
    <div class="q-card" id="card-${q.n}">
      <div class="q-header" onclick="toggle(${q.n})">
        <span class="q-num">Q${q.n}</span>
        <span class="q-title">${q.q}</span>
        <div class="q-right">
          ${badge(q.tag)}
          <span class="chevron ${openCards.has(q.n) ? 'open' : ''}" id="chev-${q.n}">▼</span>
        </div>
      </div>
      <div class="q-body ${openCards.has(q.n) ? 'open' : ''}" id="body-${q.n}">${q.body}</div>
    </div>
  `).join('');
}

function toggle(n) {
  const body = document.getElementById('body-' + n);
  const chev = document.getElementById('chev-' + n);
  if (openCards.has(n)) {
    openCards.delete(n);
    body.classList.remove('open');
    chev.classList.remove('open');
  } else {
    openCards.add(n);
    body.classList.add('open');
    chev.classList.add('open');
  }
  document.getElementById('viewed-count').textContent = openCards.size;
}

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  filterQs();
}

function filterQs() {
  const q = document.getElementById('search').value.toLowerCase();
  let filtered = QS;
  if (activeFilter !== 'all') filtered = filtered.filter(x => x.tag === activeFilter);
  if (q) filtered = filtered.filter(x => x.q.toLowerCase().includes(q) || x.body.toLowerCase().includes(q));
  render(filtered);
}

render(QS);


/* ── DARK MODE ────────────────────── */
(function(){
  var saved = localStorage.getItem('ekn-dark');
  if (saved === '1') document.body.classList.add('dark');
})();
function toggleDark() {
  var on = document.body.classList.toggle('dark');
  localStorage.setItem('ekn-dark', on ? '1' : '0');
  var btn = document.getElementById('dm-btn');
  if (btn) btn.textContent = on ? '☀ Light' : '☾ Dark';
}

/* ── INTERVIEW MODE ───────────────── */
var fmAll = [], fmIdx = 0, fmGot = 0, fmTotal = 0;

function fmStart() {
  // collect currently visible QS
  fmAll = [];
  var cards = document.querySelectorAll('.q-card');
  cards.forEach(function(c) {
    var n = parseInt(c.id.replace('card-',''));
    var q = QS.find ? QS.find(function(x){ return x.n === n; })
                    : (function(){ for(var i=0;i<QS.length;i++){ if(QS[i].n===n) return QS[i]; } })();
    if (q) fmAll.push(q);
  });
  // shuffle
  for (var i = fmAll.length-1; i > 0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var tmp = fmAll[i]; fmAll[i] = fmAll[j]; fmAll[j] = tmp;
  }
  fmIdx = 0; fmGot = 0; fmTotal = fmAll.length;
  var bar = document.getElementById('fm-bar');
  if (bar) { bar.classList.add('open'); fmShow(); }
}
function fmShow() {
  var bar = document.getElementById('fm-bar');
  if (!bar || fmIdx >= fmTotal) { fmDone(); return; }
  var q = fmAll[fmIdx];
  var pct = fmTotal > 0 ? Math.round((fmIdx/fmTotal)*100) : 0;
  document.getElementById('fm-prog').style.width = pct + '%';
  document.getElementById('fm-meta').textContent = 'Question ' + (fmIdx+1) + ' of ' + fmTotal;
  document.getElementById('fm-q-text').textContent = q.q;
  document.getElementById('fm-answer').innerHTML = q.body;
  document.getElementById('fm-answer').classList.remove('show');
  document.getElementById('fm-reveal').style.display = '';
  document.getElementById('fm-got').style.display    = 'none';
  document.getElementById('fm-miss').style.display   = 'none';
  document.getElementById('fm-score').textContent    = fmGot + ' / ' + fmIdx + ' correct';
}
function fmReveal() {
  document.getElementById('fm-answer').classList.add('show');
  document.getElementById('fm-reveal').style.display = 'none';
  document.getElementById('fm-got').style.display    = '';
  document.getElementById('fm-miss').style.display   = '';
}
function fmNext(ok) {
  if (ok) fmGot++;
  fmIdx++;
  fmShow();
}
function fmStop() {
  var bar = document.getElementById('fm-bar');
  if (bar) bar.classList.remove('open');
}
function fmDone() {
  var bar = document.getElementById('fm-bar');
  if (!bar) return;
  bar.innerHTML = '<div class="fm-done">&#127881; Session complete! You got <strong>' + fmGot + ' / ' + fmTotal + '</strong> correct.</div>'
    + '<button class="fm-stop" onclick="fmStop()">Close</button>';
}
