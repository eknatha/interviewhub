  {n:49,tag:"indexing",q:"What are the different index types in PostgreSQL: B-tree, hash, GIN, GiST and BRIN?",body:"<p>B-tree is the default for equality and ranges; GIN suits arrays, JSONB and full text; GiST handles geometric and nearest-neighbour; BRIN is tiny for naturally ordered huge tables; hash is equality only.</p><div class=\"cmds\"><div class=\"cmd\">CREATE INDEX ON docs USING gin (payload jsonb_path_ops);</div><div class=\"cmd\">CREATE INDEX ON events USING brin (created_at);</div></div><div class=\"tip\"><b>Interview tip:</b> BRIN needs physical correlation.</div>"},
  {n:50,tag:"indexing",q:"What is an index-only scan and what prevents it in PostgreSQL?",body:"<p>The query is answered from the index alone without visiting the table, but only if the visibility map shows pages as all-visible.</p><div class=\"cmds\"><div class=\"cmd\">CREATE INDEX ON orders (customer_id) INCLUDE (total);</div><div class=\"cmd\">EXPLAIN (ANALYZE, BUFFERS) SELECT total FROM orders WHERE customer_id=7;</div></div><div class=\"tip\"><b>Interview tip:</b> VACUUM keeps the visibility map fresh.</div>"},
  {n:51,tag:"query",q:"How do you use pagination efficiently: OFFSET versus keyset pagination?",body:"<p>OFFSET scans and discards rows so deep pages get slower; keyset (seek) pagination uses an indexed last-seen value and stays fast.</p><div class=\"cmds\"><div class=\"cmd\">SELECT * FROM items ORDER BY id LIMIT 50 OFFSET 100000;</div><div class=\"cmd\">SELECT * FROM items WHERE id &gt; :last_id ORDER BY id LIMIT 50;</div></div><div class=\"tip\"><b>Interview tip:</b> Order by a unique indexed key.</div>"},
  {n:52,tag:"query",q:"How do you speed up COUNT(*) on large tables?",body:"<p>Use estimates from statistics, maintain counters, count with index-only scans, or cache; exact counts require scanning visible rows.</p><div class=\"cmds\"><div class=\"cmd\">SELECT reltuples::bigint FROM pg_class WHERE relname='orders';</div><div class=\"cmd\">SELECT count(*) FROM orders WHERE created_at &gt;= now() - interval '1 day';</div></div><div class=\"tip\"><b>Interview tip:</b> Ask whether exactness is really needed.</div>"},
  {n:53,tag:"query",q:"What is the difference between UNION and UNION ALL, and IN versus EXISTS?",body:"<p>UNION removes duplicates by sorting or hashing; UNION ALL just appends. EXISTS can stop at the first match and is often better than IN for correlated checks.</p><div class=\"cmds\"><div class=\"cmd\">SELECT id FROM a UNION ALL SELECT id FROM b;</div><div class=\"cmd\">SELECT 1 FROM orders o WHERE EXISTS (SELECT 1 FROM items i WHERE i.order_id=o.id);</div></div><div class=\"tip\"><b>Interview tip:</b> Default to UNION ALL if duplicates are impossible.</div>"},
  {n:54,tag:"query",q:"How do you optimise queries that use LIKE with wildcards or full-text search?",body:"<p>Leading wildcards cannot use B-tree indexes; use trigram indexes, full-text search indexes or a search engine.</p><div class=\"cmds\"><div class=\"cmd\">CREATE EXTENSION pg_trgm; CREATE INDEX ON users USING gin (name gin_trgm_ops);</div><div class=\"cmd\">SELECT * FROM docs WHERE tsv @@ to_tsquery('english','deploy &amp; rollback');</div></div><div class=\"tip\"><b>Interview tip:</b> Prefix patterns can use B-tree with the right operator class.</div>"},
  {n:55,tag:"query",q:"How do you handle bulk inserts and updates efficiently?",body:"<p>Batch rows, use COPY or multi-row inserts, disable unnecessary indexes temporarily, commit in chunks and avoid per-row round trips.</p><div class=\"cmds\"><div class=\"cmd\">COPY orders FROM '/data/orders.csv' CSV;</div><div class=\"cmd\">INSERT INTO t VALUES (1,'a'),(2,'b'),(3,'c');</div></div><div class=\"tip\"><b>Interview tip:</b> Round trips dominate small inserts.</div>"},
  {n:56,tag:"query",q:"How do prepared statements and the plan cache affect performance and security?",body:"<p>Prepared statements parse once and bind parameters, saving planning time and preventing SQL injection; generic plans can misestimate skewed data.</p><div class=\"cmds\"><div class=\"cmd\">PREPARE q(int) AS SELECT * FROM orders WHERE customer_id=$1; EXECUTE q(42);</div><div class=\"cmd\">SET plan_cache_mode = force_custom_plan;</div></div><div class=\"tip\"><b>Interview tip:</b> Always parameterise, never concatenate.</div>"},
  {n:57,tag:"postgres",q:"What is MVCC in PostgreSQL and how does it cause bloat?",body:"<p>Each update creates a new row version; old versions remain until vacuum removes them, so heavy updates need vacuum capacity.</p><div class=\"cmds\"><div class=\"cmd\">SELECT n_dead_tup, n_live_tup FROM pg_stat_user_tables WHERE relname='orders';</div><div class=\"cmd\">SELECT xmin, xmax, * FROM orders LIMIT 1;</div></div><div class=\"tip\"><b>Interview tip:</b> Long transactions block cleanup.</div>"},
  {n:58,tag:"postgres",q:"What is transaction ID wraparound and how do you prevent it?",body:"<p>Transaction IDs are 32-bit and wrap; vacuum freezes old rows to avoid data becoming invisible, and failing to vacuum can force the database into read-only shutdown.</p><div class=\"cmds\"><div class=\"cmd\">SELECT datname, age(datfrozenxid) FROM pg_database ORDER BY 2 DESC;</div><div class=\"cmd\">VACUUM (FREEZE, VERBOSE) big_table;</div></div><div class=\"tip\"><b>Interview tip:</b> Alert well before 1.5 billion.</div>"},
  {n:59,tag:"postgres",q:"How do you tune autovacuum for a hot table?",body:"<p>Lower scale factors per table, raise cost limit or workers, and monitor dead tuples and vacuum duration.</p><div class=\"cmds\"><div class=\"cmd\">ALTER TABLE orders SET (autovacuum_vacuum_scale_factor = 0.01, autovacuum_vacuum_cost_limit = 2000);</div><div class=\"cmd\">SELECT * FROM pg_stat_progress_vacuum;</div></div><div class=\"tip\"><b>Interview tip:</b> Defaults suit small tables, not huge ones.</div>"},
  {n:60,tag:"postgres",q:"What is table and index bloat repair with pg_repack, REINDEX CONCURRENTLY and VACUUM FULL?",body:"<p>VACUUM FULL rewrites the table with an exclusive lock; pg_repack and REINDEX CONCURRENTLY rebuild online with minimal locking.</p><div class=\"cmds\"><div class=\"cmd\">REINDEX INDEX CONCURRENTLY ix_orders_created;</div><div class=\"cmd\">pg_repack -d appdb -t orders</div></div><div class=\"tip\"><b>Interview tip:</b> Avoid VACUUM FULL on live systems.</div>"},
  {n:61,tag:"postgres",q:"How do you use EXPLAIN (ANALYZE, BUFFERS) to find I/O problems?",body:"<p>Buffers show shared hits versus reads; many reads mean cache misses and disk I/O. Compare estimated and actual rows to spot bad statistics.</p><div class=\"cmds\"><div class=\"cmd\">EXPLAIN (ANALYZE, BUFFERS, VERBOSE) SELECT ...;</div><div class=\"cmd\">SET track_io_timing = on;</div></div><div class=\"tip\"><b>Interview tip:</b> Actual versus estimated rows is the first check.</div>"},
  {n:62,tag:"mysql",q:"How does InnoDB use the redo log, undo log and doublewrite buffer?",body:"<p>Redo ensures durability, undo supports rollback and MVCC, and doublewrite protects against torn pages.</p><div class=\"cmds\"><div class=\"cmd\">SHOW ENGINE INNODB STATUS\\G</div><div class=\"cmd\">SHOW VARIABLES LIKE 'innodb_flush_log_at_trx_commit';</div></div><div class=\"tip\"><b>Interview tip:</b> Flush setting trades durability for speed.</div>"},
  {n:63,tag:"mysql",q:"How do gap locks and next-key locks cause deadlocks in InnoDB at REPEATABLE READ?",body:"<p>Range scans lock gaps between index records to prevent phantoms; concurrent inserts into the same gap can deadlock.</p><div class=\"cmds\"><div class=\"cmd\">SELECT * FROM t WHERE id BETWEEN 10 AND 20 FOR UPDATE;</div><div class=\"cmd\">SHOW ENGINE INNODB STATUS\\G -- LATEST DETECTED DEADLOCK</div></div><div class=\"tip\"><b>Interview tip:</b> READ COMMITTED reduces gap locking.</div>"},
  {n:64,tag:"mysql",q:"How do you choose between MySQL replication formats and what is GTID replication?",body:"<p>Row-based replication is the safest; GTIDs give each transaction a global ID, making failover and replica repointing much simpler.</p><div class=\"cmds\"><div class=\"cmd\">SHOW VARIABLES LIKE 'binlog_format';</div><div class=\"cmd\">CHANGE REPLICATION SOURCE TO SOURCE_AUTO_POSITION=1;</div></div><div class=\"tip\"><b>Interview tip:</b> Use ROW format and GTIDs.</div>"},
  {n:65,tag:"mysql",q:"How do you perform online schema changes in MySQL with gh-ost or pt-online-schema-change?",body:"<p>These tools create a shadow table, copy data in chunks while capturing changes, and swap tables atomically with minimal blocking.</p><div class=\"cmds\"><div class=\"cmd\">gh-ost --alter='ADD COLUMN notes TEXT' --database=app --table=orders --execute</div><div class=\"cmd\">pt-online-schema-change --alter 'ADD INDEX ix(c)' D=app,t=orders --execute</div></div><div class=\"tip\"><b>Interview tip:</b> Always test with dry-run first.</div>"},
  {n:66,tag:"mysql",q:"What are common causes of MySQL replication lag and how do you reduce them?",body:"<p>Single-threaded apply, large transactions, heavy replica reads, I/O limits and missing indexes on replicas; use parallel replication and smaller transactions.</p><div class=\"cmds\"><div class=\"cmd\">SHOW REPLICA STATUS\\G</div><div class=\"cmd\">SET GLOBAL replica_parallel_workers=8;</div></div><div class=\"tip\"><b>Interview tip:</b> Large transactions serialise apply.</div>"},
  {n:67,tag:"connections",q:"How do you size a database connection pool correctly?",body:"<p>Pool size should match what the database can run concurrently, often cores times two plus disks, not the number of clients; more connections increase contention.</p><div class=\"cmds\"><div class=\"cmd\">SELECT count(*), state FROM pg_stat_activity GROUP BY state;</div><div class=\"cmd\">pool_size = ((core_count * 2) + effective_spindle_count)</div></div><div class=\"tip\"><b>Interview tip:</b> Smaller pools are often faster.</div>"},
  {n:68,tag:"connections",q:"What are the PgBouncer pooling modes and their trade-offs?",body:"<p>Session mode holds a server connection per client; transaction mode releases after each transaction (best multiplexing, restricts session features); statement mode is rarely used.</p><div class=\"cmds\"><div class=\"cmd\">pool_mode = transaction\ndefault_pool_size = 20\nmax_client_conn = 2000</div><div class=\"cmd\">SHOW POOLS;</div></div><div class=\"tip\"><b>Interview tip:</b> Transaction mode breaks session state.</div>"},
  {n:69,tag:"connections",q:"How do you find and handle idle-in-transaction sessions?",body:"<p>They hold locks and block vacuum; find them in pg_stat_activity and set idle_in_transaction_session_timeout.</p><div class=\"cmds\"><div class=\"cmd\">SELECT pid, now()-xact_start AS age, query FROM pg_stat_activity WHERE state='idle in transaction' ORDER BY age DESC;</div><div class=\"cmd\">ALTER SYSTEM SET idle_in_transaction_session_timeout='60s';</div></div><div class=\"tip\"><b>Interview tip:</b> A forgotten BEGIN can bloat the whole database.</div>"},
  {n:70,tag:"connections",q:"How do you handle connection storms after a database restart or failover?",body:"<p>Use jittered retries, connection limits, pooler queues and gradual ramp-up so clients do not overwhelm the recovering database.</p><div class=\"cmds\"><div class=\"cmd\">max_connections = 500</div><div class=\"cmd\">retry delay = base * 2^n + random(0, base)</div></div><div class=\"tip\"><b>Interview tip:</b> Thundering herd needs jitter.</div>"},
  {n:71,tag:"connections",q:"What is max_connections and what are the memory implications of raising it?",body:"<p>Each connection uses memory for backend state and work_mem per operation; raising limits without pooling risks out-of-memory and slowdowns.</p><div class=\"cmds\"><div class=\"cmd\">SHOW max_connections;</div><div class=\"cmd\">SELECT pg_size_pretty(pg_backend_memory_contexts_total) -- per-backend memory</div></div><div class=\"tip\"><b>Interview tip:</b> Pool instead of raising the limit.</div>"},
  {n:72,tag:"replication",q:"What is a replication slot in PostgreSQL and what risks does it carry?",body:"<p>A slot makes the primary retain WAL until the consumer confirms it; an inactive slot makes WAL pile up and can fill the disk.</p><div class=\"cmds\"><div class=\"cmd\">SELECT slot_name, active, pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)) AS lag FROM pg_replication_slots;</div><div class=\"cmd\">SELECT pg_drop_replication_slot('old_slot');</div></div><div class=\"tip\"><b>Interview tip:</b> Alert on retained WAL size.</div>"},
  {n:73,tag:"replication",q:"How do you do a zero-downtime failover with a replicated database and what can go wrong?",body:"<p>Detect failure reliably, fence the old primary, promote the most caught-up replica, redirect traffic and rebuild; risks are split brain and data loss with async replication.</p><div class=\"cmds\"><div class=\"cmd\">pg_ctl promote -D /var/lib/postgresql/data</div><div class=\"cmd\">patronictl failover cluster</div></div><div class=\"tip\"><b>Interview tip:</b> Fence the old primary.</div>"},
  {n:74,tag:"replication",q:"How do you route reads to replicas safely given replication lag?",body:"<p>Send only lag-tolerant reads to replicas, use read-your-writes strategies for recent writers, and monitor lag with fallbacks to the primary.</p><div class=\"cmds\"><div class=\"cmd\">SELECT now() - pg_last_xact_replay_timestamp() AS lag;</div><div class=\"cmd\">SELECT pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn) FROM pg_stat_replication;</div></div><div class=\"tip\"><b>Interview tip:</b> Not all reads are equal.</div>"},
  {n:75,tag:"replication",q:"What is the difference between logical and physical backups and when would you use each?",body:"<p>Physical backups copy data files and WAL for fast full restore and PITR; logical backups dump SQL or rows, which are portable but slower.</p><div class=\"cmds\"><div class=\"cmd\">pg_basebackup -D /backup -X stream -P</div><div class=\"cmd\">pg_dump -Fc appdb &gt; appdb.dump</div></div><div class=\"tip\"><b>Interview tip:</b> Test the restore, not just the backup.</div>"},
  {n:76,tag:"replication",q:"What is change data capture and how do logical decoding or binlog readers support it?",body:"<p>CDC streams row-level changes from the database log to downstream systems with low overhead, avoiding polling and dual writes.</p><div class=\"cmds\"><div class=\"cmd\">CREATE PUBLICATION app_pub FOR TABLE orders;</div><div class=\"cmd\">debezium connector reading WAL via a replication slot</div></div><div class=\"tip\"><b>Interview tip:</b> Handle schema changes and slot lag.</div>"},
  {n:77,tag:"schema",q:"How do you choose data types that affect performance and storage?",body:"<p>Use the smallest suitable types, avoid text for numbers, use timestamps with time zone appropriately and consistent types for join keys.</p><div class=\"cmds\"><div class=\"cmd\">ALTER TABLE events ALTER COLUMN id TYPE bigint;</div><div class=\"cmd\">CREATE TABLE t (id bigint, created_at timestamptz, amount numeric(12,2));</div></div><div class=\"tip\"><b>Interview tip:</b> Mismatched types prevent index use.</div>"},
  {n:78,tag:"schema",q:"What are the trade-offs of UUIDs versus auto-increment integers as primary keys?",body:"<p>Integers are compact and ordered; UUIDs are globally unique and safe to generate anywhere but larger and random unless time-ordered.</p><div class=\"cmds\"><div class=\"cmd\">id bigint GENERATED ALWAYS AS IDENTITY</div><div class=\"cmd\">id uuid DEFAULT gen_random_uuid()</div></div><div class=\"tip\"><b>Interview tip:</b> Consider UUIDv7 or ULID for ordering.</div>"},
  {n:79,tag:"schema",q:"How do you design indexes and tables for multi-tenant applications?",body:"<p>Include tenant_id in keys and indexes, choose shared schema, schema-per-tenant or database-per-tenant by isolation needs, and guard against noisy neighbours.</p><div class=\"cmds\"><div class=\"cmd\">CREATE INDEX ON orders (tenant_id, created_at);</div><div class=\"cmd\">ALTER TABLE orders ENABLE ROW LEVEL SECURITY;</div></div><div class=\"tip\"><b>Interview tip:</b> Lead with tenant_id in composite indexes.</div>"},
  {n:80,tag:"schema",q:"When should you use JSONB columns versus relational columns?",body:"<p>Use JSONB for sparse, evolving or document-like attributes; use relational columns for core, frequently filtered fields needing constraints and joins.</p><div class=\"cmds\"><div class=\"cmd\">CREATE INDEX ON events USING gin (payload);</div><div class=\"cmd\">SELECT payload-&gt;&gt;'plan' FROM accounts WHERE payload @&gt; '{\"active\": true}';</div></div><div class=\"tip\"><b>Interview tip:</b> Promote hot JSON fields to columns.</div>"},
  {n:81,tag:"schema",q:"How do foreign keys affect performance and should you always use them?",body:"<p>They guarantee integrity but add checks on writes and need indexes on the referencing column; use them by default and remove only with a clear reason.</p><div class=\"cmds\"><div class=\"cmd\">CREATE INDEX ON order_items (order_id);</div><div class=\"cmd\">ALTER TABLE order_items ADD CONSTRAINT fk FOREIGN KEY (order_id) REFERENCES orders(id) ON DELETE CASCADE;</div></div><div class=\"tip\"><b>Interview tip:</b> Index the child column.</div>"},
  {n:82,tag:"nosql",q:"How does DynamoDB partitioning work and how do you avoid hot partitions?",body:"<p>Items are spread by partition key hash; uneven access concentrates load on one partition. Use high-cardinality keys, write sharding and adaptive capacity.</p><div class=\"cmds\"><div class=\"cmd\">pk = f\"{user_id}#{random.randint(0,9)}\"</div><div class=\"cmd\">aws dynamodb describe-table --table-name events</div></div><div class=\"tip\"><b>Interview tip:</b> Design keys from access patterns first.</div>"},
  {n:83,tag:"nosql",q:"What are the eviction policies in Redis and how do you choose one?",body:"<p>When memory is full Redis evicts by policy such as allkeys-lru, volatile-ttl or noeviction; choose by whether the data is a cache or a store.</p><div class=\"cmds\"><div class=\"cmd\">CONFIG SET maxmemory 2gb</div><div class=\"cmd\">CONFIG SET maxmemory-policy allkeys-lru</div></div><div class=\"tip\"><b>Interview tip:</b> Never use noeviction for a pure cache.</div>"},
  {n:84,tag:"nosql",q:"How do you prevent cache stampedes and keep a cache consistent with the database?",body:"<p>Use request coalescing, jittered TTLs, stale-while-revalidate and explicit invalidation on writes; accept eventual consistency where possible.</p><div class=\"cmds\"><div class=\"cmd\">SET lock:key 1 NX EX 10</div><div class=\"cmd\">TTL = base + random(0, 60)</div></div><div class=\"tip\"><b>Interview tip:</b> Two hard problems: invalidation and naming.</div>"},
  {n:85,tag:"nosql",q:"How does MongoDB indexing and the aggregation pipeline affect performance?",body:"<p>Compound indexes follow the equality-sort-range rule; the pipeline should filter and project early so stages can use indexes.</p><div class=\"cmds\"><div class=\"cmd\">db.orders.createIndex({customerId:1, createdAt:-1})</div><div class=\"cmd\">db.orders.find({customerId:7}).explain('executionStats')</div></div><div class=\"tip\"><b>Interview tip:</b> Equality, sort, range.</div>"},
  {n:86,tag:"nosql",q:"What consistency models exist in distributed NoSQL stores and how do you tune them?",body:"<p>Eventual, read-your-writes, strong and tunable quorum consistency; choose per operation based on correctness needs and latency.</p><div class=\"cmds\"><div class=\"cmd\">CONSISTENCY QUORUM; -- Cassandra cqlsh</div><div class=\"cmd\">aws dynamodb get-item --consistent-read</div></div><div class=\"tip\"><b>Interview tip:</b> R + W > N gives strong reads in quorum systems.</div>"},
  {n:87,tag:"cloud",q:"How do you use RDS or Cloud SQL read replicas, Multi-AZ and high availability correctly?",body:"<p>HA standby is for failover durability, not read scaling; read replicas scale reads asynchronously; know the failover time and test it.</p><div class=\"cmds\"><div class=\"cmd\">aws rds describe-db-instances --query 'DBInstances[].[DBInstanceIdentifier,MultiAZ]'</div><div class=\"cmd\">aws rds reboot-db-instance --db-instance-identifier db --force-failover</div></div><div class=\"tip\"><b>Interview tip:</b> Standbys do not serve reads in classic Multi-AZ.</div>"},
  {n:88,tag:"cloud",q:"How do you tune IOPS and storage on cloud managed databases?",body:"<p>Match provisioned or burst IOPS and throughput to the workload; watch queue depth, burst balance and storage autoscaling limits.</p><div class=\"cmds\"><div class=\"cmd\">aws cloudwatch get-metric-statistics --metric-name DiskQueueDepth ...</div><div class=\"cmd\">gcloud sql instances patch db --storage-auto-increase</div></div><div class=\"tip\"><b>Interview tip:</b> Burst credits run out.</div>"},
  {n:89,tag:"cloud",q:"What is Amazon Aurora and how does its architecture differ from standard PostgreSQL or MySQL?",body:"<p>Aurora separates compute from a shared, distributed storage layer replicated six ways across three zones; replicas read the same storage, giving fast failover and low replica lag.</p><div class=\"cmds\"><div class=\"cmd\">aws rds describe-db-clusters</div><div class=\"cmd\">aws rds failover-db-cluster --db-cluster-identifier prod</div></div><div class=\"tip\"><b>Interview tip:</b> Storage is shared, not copied per replica.</div>"},
  {n:90,tag:"cloud",q:"How do you monitor a managed database effectively with cloud-native tools?",body:"<p>Combine instance metrics, enhanced monitoring, performance insights and logs; alert on saturation and replication, not just CPU.</p><div class=\"cmds\"><div class=\"cmd\">aws pi get-resource-metrics ...</div><div class=\"cmd\">gcloud sql operations list --instance db</div></div><div class=\"tip\"><b>Interview tip:</b> Use Performance Insights for top SQL.</div>"},
  {n:91,tag:"cloud",q:"How do you plan a major version upgrade of a production database with minimal downtime?",body:"<p>Test on a clone, check extension and application compatibility, use logical replication or blue-green deployments for near-zero downtime, and keep a rollback path.</p><div class=\"cmds\"><div class=\"cmd\">pg_upgrade --check</div><div class=\"cmd\">aws rds create-blue-green-deployment ...</div></div><div class=\"tip\"><b>Interview tip:</b> Rehearse with production-like data.</div>"},
  {n:92,tag:"ops",q:"How do you investigate sudden latency spikes on a database that otherwise looks healthy?",body:"<p>Correlate with locks, checkpoints, autovacuum, cache misses, plan changes, noisy neighbours and I/O limits using wait events and time-series.</p><div class=\"cmds\"><div class=\"cmd\">SELECT wait_event_type, wait_event, count(*) FROM pg_stat_activity GROUP BY 1,2 ORDER BY 3 DESC;</div><div class=\"cmd\">SELECT * FROM pg_stat_bgwriter;</div></div><div class=\"tip\"><b>Interview tip:</b> Wait events show where time goes.</div>"},
  {n:93,tag:"ops",q:"How do you set up and use slow query logging and query analysis tools?",body:"<p>Log queries over a threshold, aggregate with tools like pg_stat_statements, pgBadger or pt-query-digest, and fix the top offenders by total time.</p><div class=\"cmds\"><div class=\"cmd\">ALTER SYSTEM SET log_min_duration_statement = '500ms';</div><div class=\"cmd\">pt-query-digest slow.log | head -50</div></div><div class=\"tip\"><b>Interview tip:</b> Rank by total time, not single slowest.</div>"},
  {n:94,tag:"ops",q:"How do you capacity-plan a database: CPU, memory, storage and growth?",body:"<p>Track trends in data size, working set, QPS and latency, project growth, and size for peak plus headroom with a plan for scaling up or out.</p><div class=\"cmds\"><div class=\"cmd\">SELECT pg_size_pretty(pg_database_size(current_database()));</div><div class=\"cmd\">SELECT relname, pg_size_pretty(pg_total_relation_size(relid)) FROM pg_catalog.pg_statio_user_tables ORDER BY pg_total_relation_size(relid) DESC LIMIT 10;</div></div><div class=\"tip\"><b>Interview tip:</b> The working set should fit in memory.</div>"},
  {n:95,tag:"ops",q:"How do you archive or purge old data from huge tables without hurting production?",body:"<p>Partition by time and drop partitions, or delete in small batches with indexes, throttling and monitoring; archive first to cheaper storage.</p><div class=\"cmds\"><div class=\"cmd\">ALTER TABLE events DETACH PARTITION events_2024_01;</div><div class=\"cmd\">DELETE FROM logs WHERE id IN (SELECT id FROM logs WHERE created_at &lt; now()-interval '1 year' LIMIT 5000);</div></div><div class=\"tip\"><b>Interview tip:</b> Dropping a partition is instant; deleting is not.</div>"},
  {n:96,tag:"ops",q:"How do you handle a runaway query or lock pile-up in production?",body:"<p>Identify the blocker with the lock graph, assess impact, cancel or terminate it, and then fix the root cause with timeouts and query changes.</p><div class=\"cmds\"><div class=\"cmd\">SELECT pid, pg_blocking_pids(pid), query FROM pg_stat_activity WHERE cardinality(pg_blocking_pids(pid))&gt;0;</div><div class=\"cmd\">SELECT pg_cancel_backend(pid);</div></div><div class=\"tip\"><b>Interview tip:</b> Cancel before terminate.</div>"},
  {n:97,tag:"ops",q:"How do you run safe load tests against a database before a launch?",body:"<p>Use production-like data volume and distribution, replay realistic workloads, ramp gradually, measure percentiles and resources, and isolate from production.</p><div class=\"cmds\"><div class=\"cmd\">pgbench -c 50 -j 4 -T 300 -f workload.sql appdb</div><div class=\"cmd\">sysbench oltp_read_write --threads=64 run</div></div><div class=\"tip\"><b>Interview tip:</b> Test with realistic data skew.</div>"}
];

let activeFilter = 'all';
let openCards = new Set();

function badge(tag){
  const labels={indexing:'Indexing',query:'Query optimization',postgres:'PostgreSQL',mysql:'MySQL',connections:'Connections',replication:'Replication & HA',cloud:'Cloud databases',nosql:'NoSQL',schema:'Schema design',ops:'Ops & maintenance'};
  return `<span class="badge ${tag}">${labels[tag]||tag}</span>`;
}

function render(qs){
  document.getElementById('count-bar').textContent=`Showing ${qs.length} of 97 questions`;
  document.getElementById('q-list').innerHTML=qs.map(q=>`
    <div class="q-card" id="card-${q.n}">
      <div class="q-header" onclick="toggle(${q.n})">
        <span class="q-num">Q${q.n}</span>
        <span class="q-title">${q.q}</span>
        <div class="q-right">${badge(q.tag)}<span class="chevron${openCards.has(q.n)?' open':''}" id="chev-${q.n}">▼</span></div>
      </div>
      <div class="q-body${openCards.has(q.n)?' open':''}" id="body-${q.n}">${q.body}</div>
    </div>`).join('');
}

function toggle(n){
  const body=document.getElementById('body-'+n);
  const chev=document.getElementById('chev-'+n);
  if(openCards.has(n)){openCards.delete(n);body.classList.remove('open');chev.classList.remove('open');}
  else{openCards.add(n);body.classList.add('open');chev.classList.add('open');}
  document.getElementById('viewed-count').textContent=openCards.size;
}

function setFilter(f,el){
  activeFilter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  filterQs();
}

function filterQs(){
  const q=document.getElementById('search').value.toLowerCase();
  let filtered=QS;
  if(activeFilter!=='all') filtered=filtered.filter(x=>x.tag===activeFilter);
  if(q) filtered=filtered.filter(x=>x.q.toLowerCase().includes(q)||x.body.toLowerCase().includes(q));
  render(filtered);
}

render(QS);


/* ── DARK MODE ────────────────────── */
(function(){
  var saved = localStorage.getItem('ekn-dark');
  if (saved === '1') document.body.classList.add('dark');
})();
function toggleDark() {
  var on = document.body.classList.toggle('dark');
  localStorage.setItem('ekn-dark', on ? '1' : '0');
  var btn = document.getElementById('dm-btn');
  if (btn) btn.textContent = on ? '☀ Light' : '☾ Dark';
}

/* ── INTERVIEW MODE ───────────────── */
var fmAll = [], fmIdx = 0, fmGot = 0, fmTotal = 0;

function fmStart() {
  // collect currently visible QS
  fmAll = [];
  var cards = document.querySelectorAll('.q-card');
  cards.forEach(function(c) {
    var n = parseInt(c.id.replace('card-',''));
    var q = QS.find ? QS.find(function(x){ return x.n === n; })
                    : (function(){ for(var i=0;i<QS.length;i++){ if(QS[i].n===n) return QS[i]; } })();
    if (q) fmAll.push(q);
  });
  // shuffle
  for (var i = fmAll.length-1; i > 0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var tmp = fmAll[i]; fmAll[i] = fmAll[j]; fmAll[j] = tmp;
  }
  fmIdx = 0; fmGot = 0; fmTotal = fmAll.length;
  var bar = document.getElementById('fm-bar');
  if (bar) { bar.classList.add('open'); fmShow(); }
}
function fmShow() {
  var bar = document.getElementById('fm-bar');
  if (!bar || fmIdx >= fmTotal) { fmDone(); return; }
  var q = fmAll[fmIdx];
  var pct = fmTotal > 0 ? Math.round((fmIdx/fmTotal)*100) : 0;
  document.getElementById('fm-prog').style.width = pct + '%';
  document.getElementById('fm-meta').textContent = 'Question ' + (fmIdx+1) + ' of ' + fmTotal;
  document.getElementById('fm-q-text').textContent = q.q;
  document.getElementById('fm-answer').innerHTML = q.body;
  document.getElementById('fm-answer').classList.remove('show');
  document.getElementById('fm-reveal').style.display = '';
  document.getElementById('fm-got').style.display    = 'none';
  document.getElementById('fm-miss').style.display   = 'none';
  document.getElementById('fm-score').textContent    = fmGot + ' / ' + fmIdx + ' correct';
}
function fmReveal() {
  document.getElementById('fm-answer').classList.add('show');
  document.getElementById('fm-reveal').style.display = 'none';
  document.getElementById('fm-got').style.display    = '';
  document.getElementById('fm-miss').style.display   = '';
}
function fmNext(ok) {
  if (ok) fmGot++;
  fmIdx++;
  fmShow();
}
function fmStop() {
  var bar = document.getElementById('fm-bar');
  if (bar) bar.classList.remove('open');
}
function fmDone() {
  var bar = document.getElementById('fm-bar');
  if (!bar) return;
  bar.innerHTML = '<div class="fm-done">&#127881; Session complete! You got <strong>' + fmGot + ' / ' + fmTotal + '</strong> correct.</div>'
    + '<button class="fm-stop" onclick="fmStop()">Close</button>';
}
