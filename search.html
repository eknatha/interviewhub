<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search all questions — InterviewHub</title>
<meta name="description" content="Search every InterviewHub question across all guides at once. Works offline.">
<link rel="canonical" href="https://interviewhub.eknathalabs.com/search.html">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f0;--surface:#fff;--border:#e4e4dc;--text:#1a1a1a;--muted:#666;--accent:#1D9E75;--accent-bg:#E1F5EE;--accent-dk:#0F6E56;--info:#185FA5;--mark:#FFF1A8}
body.dark{--bg:#111314;--surface:#1a1d1f;--border:#2e3235;--text:#e8eaec;--muted:#8a9099;--accent-bg:#0d2a20;--accent-dk:#4dd4a8;--info:#7ab0ec;--mark:#5b4d00}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:.8rem 1.25rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header a.back{font-size:12px;font-weight:600;color:var(--info);text-decoration:none;border:1px solid var(--border);border-radius:7px;padding:4px 10px}
header h1{font-size:16px;font-weight:700;flex:1;min-width:160px}
.btn{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--accent)}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:1.25rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:.8rem}
.bar input{flex:1 1 280px;font:inherit;font-size:16px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
.bar select{font:inherit;font-size:14px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);max-width:100%}
.meta{font-size:13px;color:var(--muted);margin-bottom:.8rem}
.res{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.8rem 1rem;margin-bottom:10px}
.res:hover{border-color:var(--accent)}
.res .g{font-size:11px;font-weight:700;color:var(--accent-dk);background:var(--accent-bg);border-radius:6px;padding:2px 8px;display:inline-block;margin-bottom:4px}
.res .t{font-size:15px;font-weight:650;overflow-wrap:anywhere}
.res .s{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:2rem 0;text-align:center;color:var(--muted)}
.more{display:block;margin:10px auto}
.hint{font-size:12px;color:var(--muted);margin-top:.5rem}
kbd{font:inherit;font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 5px;background:var(--surface)}
@media(max-width:640px){header{padding:.6rem 12px}main{padding:1rem 12px}.bar select{width:100%}}
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<header>
  <a class="back" href="index.html">&larr; InterviewHub</a>
  <h1>Search all questions</h1>
  <button class="btn" id="theme" type="button">&#9790; Dark</button>
</header>
<main>
  <div class="bar">
    <input id="q" type="search" placeholder="Search questions and answers, e.g. etcd backup, PodDisruptionBudget, vLLM" autocomplete="off" autofocus aria-label="Search">
    <select id="g" aria-label="Filter by guide"><option value="">All guides</option></select>
  </div>
  <div class="meta" id="meta" aria-live="polite"></div>
  <div id="out"></div>
  <button class="btn more" id="more" type="button" hidden>Show more</button>
  <p class="hint">Tip: press <kbd>/</kbd> to focus the search box. Every word you type must appear in the question or its answer. Everything runs in your browser, offline.</p>
</main>
<script src="search_index.js"></script>
<script>
(function(){
  'use strict';
  var I=window.SEARCH_INDEX, Q=I.q, G=I.g, PAGE=40, shown=PAGE, hits=[];
  var $=function(id){return document.getElementById(id);};
  var inp=$('q'), sel=$('g'), out=$('out'), meta=$('meta'), more=$('more');
  G.forEach(function(g,i){var o=document.createElement('option');o.value=i;o.textContent=g[1];sel.appendChild(o);});
  var dark=false; try{var s=localStorage.getItem('ekn-dark');dark=s==='1'||(s===null&&matchMedia('(prefers-color-scheme: dark)').matches);}catch(e){}
  function theme(){document.body.classList.toggle('dark',dark);$('theme').textContent=dark?'☀ Light':'☾ Dark';}
  $('theme').onclick=function(){dark=!dark;theme();try{localStorage.setItem('ekn-dark',dark?'1':'0');}catch(e){}};
  theme();
  var low=Q.map(function(r){return [r[3].toLowerCase(), r[4].toLowerCase()];});
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function re(tokens){return new RegExp('('+tokens.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')','ig');}
  function search(){
    var raw=inp.value.trim().toLowerCase(), gi=sel.value;
    var tokens=raw.split(/\s+/).filter(function(t){return t.length>0;});
    hits=[]; shown=PAGE;
    if(!tokens.length){render(tokens);return;}
    for(var i=0;i<Q.length;i++){
      if(gi!==''&&Q[i][0]!==+gi) continue;
      var t=low[i][0], b=low[i][1], sc=0, ok=true;
      for(var k=0;k<tokens.length;k++){
        var w=tokens[k], inT=t.indexOf(w), inB=b.indexOf(w);
        if(inT<0&&inB<0){ok=false;break;}
        if(inT>=0){sc+=5; if(inT===0||/\W/.test(t.charAt(inT-1))) sc+=4;}
        if(inB>=0) sc+=1;
      }
      if(!ok) continue;
      if(tokens.length>1&&t.indexOf(raw)>=0) sc+=12;
      if(Q[i][2]&&tokens.indexOf(Q[i][2].toLowerCase())>=0) sc+=2;
      hits.push([sc,i]);
    }
    hits.sort(function(a,b){return b[0]-a[0]||a[1]-b[1];});
    render(tokens);
  }
  function snippet(i,tokens){
    var b=Q[i][4], l=low[i][1], p=-1;
    for(var k=0;k<tokens.length&&p<0;k++) p=l.indexOf(tokens[k]);
    if(p<0) return b.slice(0,150);
    var s=Math.max(0,p-60), e=Math.min(b.length,p+120);
    return (s>0?'…':'')+b.slice(s,e)+(e<b.length?'…':'');
  }
  function render(tokens){
    if(!tokens.length){out.innerHTML='<div class="empty">Type to search '+Q.length.toLocaleString()+' questions across '+G.length+' guides.</div>';meta.textContent='';more.hidden=true;return;}
    if(!hits.length){out.innerHTML='<div class="empty">No questions match. Try fewer or different words.</div>';meta.textContent='0 results';more.hidden=true;return;}
    var rx=re(tokens), html='', n=Math.min(shown,hits.length);
    for(var j=0;j<n;j++){
      var i=hits[j][1], r=Q[i], g=G[r[0]];
      html+='<a class="res" href="'+g[0]+'#card-'+r[1]+'"><span class="g">'+esc(g[1])+' · Q'+r[1]+'</span><div class="t">'+esc(r[3]).replace(rx,'<mark>$1</mark>')+'</div><div class="s">'+esc(snippet(i,tokens)).replace(rx,'<mark>$1</mark>')+'</div></a>';
    }
    out.innerHTML=html; meta.textContent=hits.length.toLocaleString()+' result'+(hits.length===1?'':'s')+(hits.length>n?' · showing '+n:'');
    more.hidden=hits.length<=n;
  }
  var tm; inp.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){search();try{history.replaceState(null,'','?q='+encodeURIComponent(inp.value));}catch(e){}},120);});
  sel.addEventListener('change',search);
  more.onclick=function(){shown+=PAGE;render(inp.value.trim().toLowerCase().split(/\s+/).filter(Boolean));};
  document.addEventListener('keydown',function(e){if(e.key==='/'&&document.activeElement!==inp&&document.activeElement.tagName!=='SELECT'){e.preventDefault();inp.focus();inp.select();}});
  var m=/[?&]q=([^&]*)/.exec(location.search); if(m){try{inp.value=decodeURIComponent(m[1].replace(/\+/g,' '));}catch(e){}}
  var gm=/[?&]g=(\d+)/.exec(location.search); if(gm) sel.value=gm[1];
  search();
})();
</script>
</body>
</html>
